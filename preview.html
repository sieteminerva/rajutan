<!-- preview.html -->
<!doctype html>
<html>
  <head>
    <title>Rajutan Live Preview Canvas</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <!-- Wadah utama tempat DOMRenderer merajut komponen #home -->
    <div id="canvas-root"></div>

    <script type="module">
      import { RajutanRouter, DOMRenderer } from "/assets/lite-framework.js";

      // Jalankan Router di dalam Iframe
      // Router akan membaca hash iframe sendiri (misal: preview.html#home)
      const router = new RajutanRouter();

      // Dengarkan lemparan Manifest dari Dashboard Utama (#generator)
      window.addEventListener("message", (event) => {
        if (event.data.type === "COMPILE_EDITED_DOM") {
          const manifest = event.data.payload;

          // Bersihkan RAM via unmount & render ulang instan 0ms!
          DOMRenderer.render("#canvas-root", manifest);
        }
      });

      // Beritahu Dashboard Utama di luar bahwa iframe siap menerima data untuk rute saat ini
      window.parent.postMessage(
        {
          type: "CANVAS_ROUTER_READY",
          currentRoute: window.location.hash || "#home",
        },
        "*",
      );
    </script>
  </body>
</html>
